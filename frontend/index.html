<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BWH OS</title>
    <!-- Icons live in bwh_os/public, so the apps screen and the SPA share one set. -->
    <link rel="icon" type="image/svg+xml" href="/assets/bwh_os/images/os-logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/bwh_os/images/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/bwh_os/images/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/bwh_os/manifest.json" />
    <meta name="description" content="Control panel for BWH" />
    <meta name="theme-color" content="#344E97" />
    <!-- Installed from the home screen, the app opens without browser chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BWH OS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
