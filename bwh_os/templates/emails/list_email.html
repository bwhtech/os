<div style="max-width: 560px; margin: 0 auto; font-size: 15px; line-height: 1.6; color: #171717;">
	{{ body }}

	{% if button %}
	<p style="margin: 24px 0;">
		{# Frappe's email CSS forces a dark color on links without the btn class. #}
		<a
			class="btn"
			href="{{ button.url }}"
			style="display: inline-block; padding: 10px 18px; border-radius: 8px; background: #171717; color: #ffffff; text-decoration: none; font-weight: 600;"
		>{{ button.label }}</a>
	</p>
	{% endif %}

	{% include "bwh_os/templates/emails/list_footer.html" %}
</div>
