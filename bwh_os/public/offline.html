<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#344E97" />
		<title>Offline · BWH OS</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #ffffff;
				--ink: #171717;
				--muted: #7c7c7c;
				--button: #171717;
				--button-ink: #ffffff;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0f0f0f;
					--ink: #f3f3f3;
					--muted: #8f8f8f;
					--button: #f3f3f3;
					--button-ink: #0f0f0f;
				}
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 24px;
				box-sizing: border-box;
				background: var(--bg);
				color: var(--ink);
				font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
				text-align: center;
			}
			img {
				width: 56px;
				height: 56px;
			}
			h1 {
				margin: 16px 0 4px;
				font-size: 20px;
				font-weight: 600;
			}
			p {
				margin: 0 0 20px;
				color: var(--muted);
			}
			button {
				height: 36px;
				padding: 0 16px;
				border: 0;
				border-radius: 10px;
				background: var(--button);
				color: var(--button-ink);
				font: inherit;
				font-weight: 500;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/assets/bwh_os/images/os-logo.svg" alt="" />
			<h1>You are offline</h1>
			<p>BWH OS needs a connection. Try again when you are back online.</p>
			<button type="button" onclick="location.reload()">Try Again</button>
		</main>
	</body>
</html>
